    <rect x="16" y="160" width="24" height="24" rx="2" fill="#0284c7"/>

    <!-- QR Data Blocks Matrix -->
    <rect x="68" y="8" width="12" height="12"/>
    <rect x="92" y="8" width="24" height="12"/>
    <rect x="128" y="8" width="12" height="12"/>
    <rect x="152" y="8" width="12" height="12"/>

    <rect x="68" y="28" width="24" height="12"/>
    <rect x="104" y="28" width="12" height="12"/>
    <rect x="128" y="28" width="36" height="12"/>

    <rect x="68" y="48" width="12" height="12"/>
    <rect x="92" y="48" width="12" height="12"/>
    <rect x="116" y="48" width="24" height="12"/>
    <rect x="152" y="48" width="12" height="12"/>

