    <text x="115" y="110" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="900" fill="#7c3aed" text-anchor="middle">UPI</text>

    <!-- Bottom Matrix Bits -->
    <rect x="8" y="92" width="12" height="24"/>
    <rect x="32" y="92" width="24" height="12"/>
    <rect x="156" y="92" width="32" height="12"/>
    <rect x="200" y="92" width="24" height="24"/>

    <rect x="8" y="124" width="36" height="12"/>
    <rect x="56" y="124" width="12" height="12"/>
    <rect x="156" y="124" width="16" height="12"/>
    <rect x="184" y="124" width="40" height="12"/>

    <rect x="68" y="144" width="32" height="12"/>
    <rect x="112" y="144" width="24" height="12"/>
    <rect x="148" y="144" width="12" height="12"/>
    <rect x="172" y="144" width="24" height="12"/>
    <rect x="208" y="144" width="16" height="12"/>

    <rect x="68" y="164" width="16" height="12"/>
    <rect x="96" y="164" width="40" height="12"/>
    <rect x="148" y="164" width="24" height="12"/>
    <rect x="184" y="164" width="12" height="12"/>
    <rect x="208" y="164" width="16" height="12"/>

